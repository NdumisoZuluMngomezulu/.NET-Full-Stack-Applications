<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT Ticketing</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <h1>Tickets</h1>

        <form id="add-form">
            <label>Title
                <input id="title" required maxlength="200">
            </label>
            <label>Year
                <input id="date" type="number" min="2025" max="2100">
            </label>
            <label>Assignee
                <input id="assignee" maxlength="50">
            </label>
            <button>Add ticket</button>
        </form>

        <p id="message" role="alert"></p>

    <div class="filters" role="group" aria-label="Show">
      <button type="button" data-filter="all" aria-pressed="true">All</button>
      <button type="button" data-filter="unwatched" aria-pressed="false">To clear</button>
      <button type="button" data-filter="watched" aria-pressed="false">Clear</button>
    </div>

    <ul id="tickets"></ul>
    </main>
</body>
</html>
